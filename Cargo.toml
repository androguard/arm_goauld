[workspace]
resolver = "2"
members = [
    "crates/goauld-proto",
    "crates/goauld-inject",
    "crates/goauld-injector",
    "crates/goauld-native-hook",
    "crates/goauld-art-bridge",
    "crates/goauld-script",
    "crates/goauld-agent",
    "crates/goauld-host",
]
default-members = [
    "crates/goauld-proto",
    "crates/goauld-inject",
    "crates/goauld-injector",
    "crates/goauld-native-hook",
    "crates/goauld-host",
]

[workspace.package]
version = "0.1.6"
edition = "2021"
license = "Apache-2.0"
rust-version = "1.75"
authors = ["androguard"]
repository = "https://github.com/androguard/arm_goauld"

[workspace.dependencies]
goauld-proto = { path = "crates/goauld-proto" }
goauld-inject = { path = "crates/goauld-inject" }
goauld-native-hook = { path = "crates/goauld-native-hook" }
goauld-art-bridge = { path = "crates/goauld-art-bridge" }
goauld-script = { path = "crates/goauld-script", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
log = "0.4"
parking_lot = "0.12"
nix = { version = "0.29", features = ["ptrace", "process", "uio", "fs", "mman"] }
libc = "0.2"
arm_disassembler = { path = "../arm_disassembler" }
ctor = "0.2"
rquickjs = { version = "0.9", features = ["bindgen", "macro"] }
symbiote-core = { path = "../../symbiote/symbiote-core", default-features = false }
symbiote-jit = { path = "../../symbiote/symbiote-jit" }
jni = "0.21"
clap = { version = "4", features = ["derive"] }
env_logger = "0.11"
byteorder = "1"
